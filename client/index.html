<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music API Client - Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
    <h1>Music API</h1>
    <div id="authStatus" style="font-size: 0.8rem; color: #aaa;">Niezalogowany</div>

    <div id="loginPanel" class="panel">
        <h3>Logowanie</h3>
        <input type="text" id="loginInput" placeholder="Login (user1)">
        <input type="password" id="passInput" placeholder="Hasło">
        <button onclick="login()">Zaloguj</button>
    </div>

    <div id="playlistPanel" class="panel hidden">
        <h3 id="userWelcome">Witaj</h3>
        <input type="text" id="newPlaylistName" placeholder="Nazwa nowej playlisty">
        <button onclick="createPlaylist()">Stwórz playlistę</button>
        
        <div style="margin-top: 20px;">
            <h4>Moje Playlisty</h4>
            <div id="myPlaylistsList"></div>
        </div>

        <button onclick="logout()" style="background:#444; color:white; margin-top:20px;">Wyloguj</button>
    </div>
</div>

<main class="main-content">
    <div class="content-container">
        <div id="searchView">
            <div class="panel">
                <div style="display:flex; gap:10px;">
                    <input type="text" id="searchInput" placeholder="Szukaj piosenek lub playlist..." style="margin:0">
                    <button onclick="performSearch()" style="width: auto;">Szukaj</button>
                </div>
            </div>
            <table class="results-table">
                <thead><tr><th>ID</th><th>Nazwa i Autor</th><th>Typ</th></tr></thead>
                <tbody id="resultsBody"></tbody>
            </table>
        </div>

        <div id="playlistDetailView" class="hidden">
            <button class="back-btn" onclick="showSearch()">← Powrót</button>
            <div class="panel">
                <h2 id="detName"></h2>
                <p>Autor: <span id="detAuthor"></span></p>
                <div id="editTools" class="hidden">
                    <input type="number" id="songIdInput" placeholder="ID piosenki (znajdź w wyszukiwarce)">
                    <button onclick="addSongToPlaylist()" style="width: auto;">Dodaj do playlisty</button>
                </div>
            </div>
            <table class="results-table">
                <thead><tr><th>ID</th><th>Tytuł</th><th>Akcja</th></tr></thead>
                <tbody id="detSongsBody"></tbody>
            </table>
        </div>
    </div>
</main>

<div class="player-sidebar">
    <h3>Teraz grane</h3>
    <div class="panel now-playing-box">
        <div class="album-art-placeholder">♫</div>
        <h2 id="playerTitle">Wybierz utwór</h2>
        <p id="playerArtist" style="color: #aaa;">-</p>
        
        <div class="player-controls">
            <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
        </div>
        <div style="margin-top: 15px; font-size: 0.8rem; color: var(--primary);" id="playerStatus">Zatrzymano</div>
    </div>
</div>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="script.js">
    
</script>
</body>
</html>
